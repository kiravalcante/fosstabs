pre-commit:
  parallel: true
  commands:
    lint:
      root: frontend/
      glob: "*.{js,jsx,ts,tsx}"
      run: oxlint {staged_files_relative_to_root}
  format:
    root: frontend/
    glob: "*.{js,jsx,ts,tsx,json,css,md}"
    run: npx prettier --write {staged_files_relative_to_root}
    staged_fixed: true

pre-push:
  commands:
    typecheck:
      run: npm run typecheck