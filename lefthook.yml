pre-commit:
  parallel: true
  commands:
    lint:
      root: frontend/
      glob: "*.{js,jsx,ts,tsx}"
      run: npm run lint
    format:
      root: frontend/
      glob: "*.{js,jsx,ts,tsx,json,css,md}"
      run: npx prettier --write {staged_files}
      staged_fixed: true

pre-push:
  commands:
    typecheck:
      root: frontend/
      run: npm run typecheck
